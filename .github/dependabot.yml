version: 2

updates:
 # npm dependencies
 - package-ecosystem: npm
   directory: "/"
   schedule:
      interval: weekly
      day: monday
   open-pull-requests-limit: 5
   groups:
      development-dependencies:
         dependency-type: development
         update-types:
          - minor
          - patch
      production-dependencies:
         dependency-type: production
         update-types:
          - minor
          - patch

 # GitHub Actions
 - package-ecosystem: github-actions
   directory: "/"
   schedule:
      interval: weekly
      day: monday
   open-pull-requests-limit: 5
