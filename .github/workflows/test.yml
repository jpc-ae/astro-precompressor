name: tests

on:
   push:
      branches:
       - '**'
   pull_request:
   workflow_dispatch:

permissions:
   contents: read

jobs:
   test:
      name: Run tests
      runs-on: ubuntu-latest

      steps:
       - name: Checkout
         uses: actions/checkout@v7

       - name: Setup pnpm and Node.js
         uses: pnpm/setup@v3
         with:
            runtime: node@24
            require-lockfile: true

       - name: Confirm versions
         run: |
            node --version
            pnpm --version

       - name: Run tests
         run: pnpm test:all
